<!DOCTYPE html>
<html lang=""en">
<head>
    <title>simple login</title>
    <style>
        body{
            text-align:center;
            background-color:rgb(243,250.240);
            font-family:arial,arial,helvetica,sans-serif;
            padding-bottom:35%;
            margin:25%;
            }
        login{
            font-size:large;
            color:rgb(89,137,117);
            margin-bottom:2.5%;
            } 
        #user
        {
         font-size:medium;
         padding-bottom:0.5%;
         margin-bottom:2.5%;
        }
        #pass
        {
         font-size:medium;
         padding-bottom:0.5%;
         margin-bottom:2.5%;
        }
    </style>
</head>
<body>
   <div class="login">
    <h1>LOGIN</h1>
    <form action="">
        <h4>username:<input type="text" id="user" placeholder="username"></h4>
        <h4>password:<input type="password" id="pass" placeholder="password"></h4>
        <button onclick="LOGIN(user.value,pass.value)">login</button>
    </form>
</div>
<script>
function login(user,pass)
{
    if(user=="gowthami" && pass=="123456789")
    {
        alert("login succesfully");
    }
    else
    {
          alert("invalid login character");
    }
}
</script>
</body>
</html>
